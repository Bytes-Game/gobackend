name: hls-worker

# $0 transcode fleet: GitHub-hosted runners are free for public repos
# and ship with ffmpeg preinstalled. Every 30 minutes (and on manual
# dispatch) this drains the pending-transcode queue and exits — an
# always-on background worker with ≤30min latency and zero hosting cost.
#
# ⚠ THAT ≤30min LATENCY IS A LAUNCH BLOCKER ON ITS OWN. A video is not
# watchable until this runs, so on the schedule alone a creator can post
# and see nothing for half an hour. The backend can press start the
# moment a video lands (workflow_dispatch below is what it calls) —
# see transcode_wakeup.go and the ⚠ section at the top of README.md.
# The schedule then becomes the safety net rather than the only path.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   HLS_WORKER_TOKEN     — same value as the backend's env var
#   R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   R2_PUBLIC_BASE_URL   — optional OVERRIDE (custom domain/CDN). When
#                          unset, the worker uses the publicBaseUrl the
#                          backend sends with each job — same base the
#                          backend builds every other media URL from.
#
# Concurrency-safe by construction: the backend's FOR UPDATE SKIP LOCKED
# claim means overlapping runs never double-transcode; the group setting
# below avoids wasting minutes anyway.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hls-worker
  cancel-in-progress: false

env:
  # Which whisper.cpp to build, and which model to hear with. Both are part
  # of the cache key, so changing either line rebuilds once and then reuses.
  #
  # MODEL SIZE IS THE UPGRADE PATH — not switching to a different program.
  # Move up or down this list; nothing else has to change. The name goes
  # straight into the download url below, and into the cache key above it,
  # so a change re-fetches once and then reuses.
  #
  #   tiny    75MB   fastest, noticeably rougher
  #   base   142MB   quick, weak on anything but English
  #   small  466MB   ~3x base
  #   medium 1.5GB   what we run now, ~8x base
  #
  # A ".en" suffix (base.en, small.en) picks the English-ONLY build of the
  # same size. Those ignore the -l language setting entirely.
  #
  # ══════════════════════════════════════════════════════════════════════
  # WHY THIS IS NOT base.en ANY MORE
  # ══════════════════════════════════════════════════════════════════════
  #
  # It was, and the worker was already asking for language auto-detection
  # (-l auto in analyze.go) that an English-only model cannot do. So every
  # video was heard as though it were English, whatever was actually said.
  #
  # Measured over 190 videos: 126 had no audio at all and were correctly
  # skipped. Every one of the remaining 64 transcribed to SOMETHING — but
  # mostly one, two or four words. That is not people saying very little;
  # that is an English listener catching fragments of speech it does not
  # know. Only 12 of the 190 ever earned a content tag.
  #
  # ══════════════════════════════════════════════════════════════════════
  # AND WHY IT IS NOW medium RATHER THAN small
  # ══════════════════════════════════════════════════════════════════════
  #
  # small answered the question it was picked for. English came back clean:
  #
  #   "Hey, let me give you a little piece of advice, y'all. No matter what
  #    you do in life, they're all gonna doubt you"
  #
  # Hindi came back detected but rough — the model wrote Devanagari, caught
  # real words, and mangled the rest into phonetic spellings of English
  # ("negative energies" as निगर्टेप आनर्जीज़), then repeated the whole
  # sentence twice, which is what these models do on short or noisy audio.
  #
  # Rough enough that matching keywords against it would be guesswork. So
  # the model goes up again. Bigger models are markedly better at Indian
  # languages, and that is the half of the catalogue small could not read.
  #
  # `small` is a one-word step back if this costs too much throughput.
  WHISPER_RELEASE: v1.9.3
  WHISPER_MODEL_NAME: medium

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      # ubuntu-24.04 runner images no longer ship ffmpeg preinstalled
      # (the first live run failed with "executable file not found").
      # apt install adds ~30-60s per run — still free.
      #
      # tesseract is here for the same reason ffmpeg is: the worker now also
      # LOOKS at each video while it has the file, and tesseract is what reads
      # the words a creator burns onto the screen. On short video that caption
      # is very often the best description of what the video is, and nothing
      # else in the system can see it. Roughly 5 seconds of install.
      #
      # THIS is the install that matters, not the one in cmd/hls-worker/
      # Dockerfile. The Dockerfile describes an always-on container worker,
      # which is a paid plan on most hosts; this workflow is what actually
      # runs, free, every 30 minutes. Adding a tool to the Dockerfile alone
      # changes nothing about production.
      - name: install ffmpeg + tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng
          ffmpeg -version | head -1
          tesseract --version | head -1

      # ── SPEECH-TO-TEXT ────────────────────────────────────────────────────
      #
      # The third thing the worker does with each video: hear it. Reading the
      # caption on screen catches a lot, but plenty of videos say what they
      # are out loud and write nothing down.
      #
      # whisper.cpp SPECIFICALLY — not OpenAI's Python program of the same
      # name. The worker passes -m, -f, -nt, -np, -l, which is whisper.cpp's
      # command line. The Python one takes different arguments, so pointing
      # WHISPER_BIN at it would fail on every video, silently, looking
      # exactly like the feature being switched off.
      #
      # CACHED, and it has to be. Building it takes ~2 minutes and the model
      # is 142MB; doing that every 30 minutes forever would spend more time
      # installing than transcoding. The cache key is the whisper.cpp release
      # tag, so this rebuilds only when that line changes.
      - name: cache whisper.cpp
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: ~/whisper
          key: whisper-${{ env.WHISPER_RELEASE }}-${{ env.WHISPER_MODEL_NAME }}-v2

      - name: build whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$WHISPER_RELEASE" \
            https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-src
          # CMAKE_INSTALL_RPATH='$ORIGIN' is what makes the copy below
          # survivable, and it is not optional.
          #
          # By default cmake stamps the binary with the absolute path of the
          # BUILD directory and the loader looks there and nowhere else. On
          # the run that builds it, /tmp/whisper-build still exists, so it
          # works. On every cached run afterwards that directory is gone and
          # the binary dies with "libwhisper.so.1: cannot open shared object
          # file" — even though the libraries are sitting right next to it.
          #
          # $ORIGIN means "look next to me", so the bin directory works
          # wherever it is unpacked. This shipped broken once, in exactly
          # that shape: the first run passed, every cached run after it
          # failed.
          cmake -S /tmp/whisper-src -B /tmp/whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build /tmp/whisper-build -j --config Release
          # The build produces shared libraries next to the binary, so keep
          # the whole bin directory rather than copying the executable out of
          # it — on its own it will not start.
          mkdir -p ~/whisper
          cp -r /tmp/whisper-build/bin ~/whisper/bin
          curl -sSL --retry 3 -o ~/whisper/model.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-${WHISPER_MODEL_NAME}.bin"
          # Delete the build tree before anything checks the install.
          #
          # This is the important line. A check that runs while the build
          # directory is still on disk is not testing what the next run will
          # face — it can pass on a binary that only works today, which is
          # precisely how the RPATH bug above got through. Removing it makes
          # the very first run experience the cached run's conditions, so a
          # copy that will not survive caching fails immediately instead of
          # in half an hour.
          rm -rf /tmp/whisper-build /tmp/whisper-src

      # A missing or broken install must not take the run down with it: the
      # worker skips the speech pass when the binary is not where it was told
      # to look, so the right failure here is to unset the variables and carry
      # on transcoding. Losing transcripts costs some feed quality. Losing the
      # run costs every creator their upload.
      #
      # This step has already earned its keep: it is what caught the RPATH
      # bug, and it is the reason a broken whisper cost some transcripts
      # rather than every upload in that run.
      - name: check whisper works
        id: whisper
        continue-on-error: true
        run: |
          set -euo pipefail
          test -x ~/whisper/bin/whisper-cli
          test -s ~/whisper/model.bin
          # Transcribe one second of silence. Cheap, needs no fixture file,
          # and exercises the real path: the binary starts, FINDS ITS SHARED
          # LIBRARIES, and loads the model.
          #
          # Actually running it is the whole point — `test -x` passes on a
          # binary that cannot start, which is what a missing library looks
          # like. Both tests above passed on the run this was broken.
          ffmpeg -v error -f lavfi -i anullsrc=r=16000:cl=mono -t 1 /tmp/probe.wav -y
          ~/whisper/bin/whisper-cli -m ~/whisper/model.bin -f /tmp/probe.wav -nt -np
          # LD_LIBRARY_PATH belt-and-braces: the binary is built to look next
          # to itself, and this covers it even if that ever stops holding.
          echo "LD_LIBRARY_PATH=$HOME/whisper/bin"          >> "$GITHUB_ENV"
          echo "WHISPER_BIN=$HOME/whisper/bin/whisper-cli"  >> "$GITHUB_ENV"
          echo "WHISPER_MODEL=$HOME/whisper/model.bin"      >> "$GITHUB_ENV"
          echo "speech-to-text: ON"

      # TWO parallel workers: the backend's FOR UPDATE SKIP LOCKED claim
      # makes concurrent workers safe by construction, and the runner's
      # 4 cores comfortably fit two ffmpeg encodes — ~2x videos per run.
      #
      # The two budgets must satisfy:
      #   max-runtime + job-timeout + setup  <  timeout-minutes
      #   12m         + 10m         + ~5m    =  27m  <  30m    ✓
      #
      # "setup" has to cover a whisper CACHE MISS, not just apt. The cache
      # key holds the model name, so changing the model rebuilds whisper.cpp
      # and re-downloads the model on the next run: measured at 2m09s for
      # the 466MB small model, and medium is 1.5GB. That build was never in
      # this sum, which left a cache-miss run roughly a minute from the kill
      # switch without anything saying so.
      #
      # -max-runtime alone was NOT sufficient: it is only consulted
      # BEFORE claiming, so a job claimed at 19m59s still ran to
      # completion and could overshoot the 24-minute kill switch. That is
      # what happened on 2026-08-06 04:35 — hard-killed at exactly 24m,
      # the run reported failed, and the in-flight row left PENDING for
      # the reaper. -job-timeout adds the missing per-job ceiling, so the
      # worst case is bounded instead of depending on how slow one source
      # download or encode happens to be.
      #
      # Dropping max-runtime 20m→12m costs no throughput on a real
      # backlog: whatever is left is claimed by the next run.
      - name: drain transcode queue
        env:
          BACKEND_URL: https://gobackend-9nd8.onrender.com
          HLS_WORKER_TOKEN: ${{ secrets.HLS_WORKER_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          go build -o /tmp/hls-worker ./cmd/hls-worker
          /tmp/hls-worker -drain -max-runtime 12m -job-timeout 10m &
          /tmp/hls-worker -drain -max-runtime 12m -job-timeout 10m &
          wait
