name: rendition-backfill

# Give every video that predates a rendition its missing copy.
#
# ════════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS
# ════════════════════════════════════════════════════════════════════════════
#
# Adding a rung to the ladder only helps videos uploaded AFTER it. The worker
# sees a video once: it converts it, marks it done, and never looks again. So
# the day 360p was added, every video already on the platform had no 360p
# copy — which is exactly the viewers the rung was added for.
#
# Putting them back in the queue is a backend endpoint, and until now the only
# way to call it was by hand with a terminal and the admin login. That makes
# it a thing one person can do, with no record of what was run, and no way to
# tell how far through it got.
#
# ════════════════════════════════════════════════════════════════════════════
# IT ASKS FOR THE ONES THAT NEED IT, NOT FOR EVERYTHING
# ════════════════════════════════════════════════════════════════════════════
#
# The endpoint's "missing" option picks only videos that do not already have
# the named rendition. That matters twice over:
#
#   - it does not re-encode videos that are already done, so the runner time
#     goes on work that is actually needed
#   - the selection SHRINKS as the job progresses, so this can be run over and
#     over and it finishes rather than going round in circles
#
# That second one used to hold only for rungs EVERY video gets, like 360p. A
# 480p video gets no 720p_hevc, and a lean one gets no H.265 copy when it
# would be no smaller — so after re-encoding they still "lack" it, and were
# picked again every round, forever. The worker now reports which renditions
# it considered for each video (hls_ladder), and a video whose last
# conversion already considered this one drops out whether or not it got it.
# So for the H.265 rungs, "0 left" at the end is right even though some
# videos will never have one.
#
# The answer carries stillMissing — how many are left TO QUEUE after the call.
# That is the number this loop stops on, and it is why "how many did it move"
# is not enough on its own: fifty moved looks identical on the first round and
# the last.
#
# It counts videos that are FINISHED and lack the rendition. A video the
# worker is part-way through is not counted, because queueing it again would
# be wrong. So zero means "nothing left to hand over", not "every video now
# has one" — those become the same thing once the worker has drained, which
# is why a second dry run after the queue goes quiet is the real confirmation.
#
# ════════════════════════════════════════════════════════════════════════════
# NOTHING DISAPPEARS WHILE IT RUNS
# ════════════════════════════════════════════════════════════════════════════
#
# Re-queuing clears one column: the HLS manifest. The MP4 the app actually
# plays (video_url and video_variants) is untouched, no file is deleted, and
# no feed filters rows on transcode state — every query that mentions
# hls_manifest_url does so in its SELECT list, never in a WHERE. So a video
# being re-encoded keeps playing the whole time, from the copy it already had.
#
# New files land beside the old ones under a fresh prefix, and the row swaps
# over only when the worker reports success.
#
# ════════════════════════════════════════════════════════════════════════════
# WHAT IT NEEDS
# ════════════════════════════════════════════════════════════════════════════
#
# Two repository secrets (Settings → Secrets and variables → Actions):
#
#   ADMIN_USER, ADMIN_PASS — the same values the backend has in its own
#                            environment. The endpoint is admin-only.
#
# If they are not set, the first call comes back 401 and this says so in one
# line rather than failing with something that has to be decoded.

on:
  workflow_dispatch:
    inputs:
      rendition:
        description: 'Which rendition to backfill (must be one the backend stores)'
        type: string
        default: '360p'
      kind:
        description: 'challenges (the main video) or responses (the answer side of a battle)'
        type: choice
        options: [challenges, responses]
        default: challenges
      batch:
        description: 'How many videos to queue per round'
        type: string
        default: '25'
      rounds:
        description: 'Give up after this many rounds, in case something is wrong'
        type: string
        default: '40'
      dry_run:
        description: 'Only count what is left to queue; change nothing'
        type: boolean
        default: false

# One at a time. Two of these running together would each queue the same
# videos the other had just queued, and the counts would stop meaning
# anything.
concurrency:
  group: rendition-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: queue the videos that are missing this rendition
        env:
          BACKEND_URL: https://gobackend-9nd8.onrender.com
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          RENDITION: ${{ inputs.rendition }}
          KIND: ${{ inputs.kind }}
          BATCH: ${{ inputs.batch }}
          ROUNDS: ${{ inputs.rounds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          url="$BACKEND_URL/api/v1/admin/media/requeue"

          # The login goes in on stdin rather than on the command line.
          # Anything on the command line is visible to every other process on
          # the machine through ps, and a password does not belong there even
          # on a runner that is thrown away afterwards.
          auth_config=$(printf 'user = "%s:%s"\n' "$ADMIN_USER" "$ADMIN_PASS")

          # ══════════════════════════════════════════════════════════════
          # A DRY RUN ASKS A QUESTION. IT DOES NOT QUEUE ANYTHING.
          # ══════════════════════════════════════════════════════════════
          #
          # This used to request a limit of ZERO videos and say "queueing
          # nothing". It queued forty-four. A limit of zero means "the caller
          # named no size" to the backend, and falls through to its default
          # batch of fifty.
          #
          # Nothing was harmed — re-queuing is safe and those were the videos
          # we wanted anyway — but a switch labelled "change nothing" that
          # changes something is the worst kind, because it is the one people
          # reach for when they are unsure.
          #
          # countOnly is its own flag now and cannot be mistaken for a number.
          count_only=false
          if [ "$DRY_RUN" = "true" ]; then
            count_only=true
            echo "Counting only. Nothing will be queued."
          fi

          queued_total=0
          for round in $(seq 1 "$ROUNDS"); do
            if [ "$count_only" = "true" ]; then
              body=$(printf '{"countOnly":true,"kind":"%s","missing":"%s"}' \
                "$KIND" "$RENDITION")
            else
              body=$(printf '{"limit":%s,"kind":"%s","missing":"%s"}' \
                "$BATCH" "$KIND" "$RENDITION")
            fi

            code=$(printf '%s\n' "$auth_config" | curl -sS -K - \
              -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$url" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              --max-time 180)

            case "$code" in
              200) ;;
              401)
                echo "::error::The backend refused the login (401). This needs two"
                echo "repository secrets, set to the same values the backend itself"
                echo "uses: ADMIN_USER and ADMIN_PASS."
                echo "Settings → Secrets and variables → Actions → New repository secret."
                exit 1
                ;;
              400)
                echo "::error::The backend refused the request (400):"
                cat /tmp/resp.json
                echo
                echo "Most likely '$RENDITION' is not a rendition this backend stores."
                exit 1
                ;;
              503)
                echo "::error::The backend answered 503. Either its database is down,"
                echo "or ADMIN_USER/ADMIN_PASS are not set in the BACKEND's own"
                echo "environment (it says so rather than letting anyone in)."
                cat /tmp/resp.json
                exit 1
                ;;
              000)
                echo "::error::Could not reach $BACKEND_URL at all."
                exit 1
                ;;
              *)
                echo "::error::The backend answered $code:"
                cat /tmp/resp.json
                exit 1
                ;;
            esac

            requeued=$(jq -r '.requeued // 0' /tmp/resp.json)
            left=$(jq -r 'if .stillMissing == null then "unknown" else .stillMissing end' /tmp/resp.json)
            worker=$(jq -r '.workerNote // ""' /tmp/resp.json)

            if [ "$left" = "unknown" ]; then
              echo "::error::The answer carried no stillMissing count, so there is no"
              echo "way to tell whether the backlog is finished. Stopping rather than"
              echo "looping blind."
              cat /tmp/resp.json
              exit 1
            fi

            queued_total=$((queued_total + requeued))
            echo "round $round: queued $requeued, $left left to queue"

            if [ "$DRY_RUN" = "true" ]; then
              if [ "$requeued" -ne 0 ]; then
                echo "::error::A count said it queued $requeued videos. It is"
                echo "meant to change nothing. Stopping — something is wrong"
                echo "with countOnly on the backend."
                exit 1
              fi
              echo "::notice::$left $KIND are waiting for a $RENDITION copy."
              echo "Run again with dry_run off to start the backfill."
              exit 0
            fi

            if [ -n "$worker" ]; then
              echo "  worker: $worker"
            fi

            if [ "$left" -eq 0 ]; then
              echo "::notice::Backfill queued: $queued_total $KIND in $round round(s), none left to hand over."
              echo "The transcode worker has them now. It drains what it can each"
              echo "run, so the last few finish on a later run — run this again"
              echo "with dry_run on once it is quiet to confirm none came back."
              exit 0
            fi

            # Space the rounds out. Each call also asks the worker to start, and
            # queueing the whole catalogue in one tight loop would just make a
            # long line for the same worker.
            sleep 30
          done

          echo "::error::Still $left left to queue after $ROUNDS rounds"
          echo "($queued_total queued). That is not necessarily wrong — a large"
          echo "catalogue takes several runs — but it is more than this was set up"
          echo "to do in one go. Run it again, or raise the rounds input."
          exit 1
